name: Release APK

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release tag (e.g. v0.1.0)'
        required: true

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Build Release APK
        run: ./gradlew assembleRelease --no-daemon --console=plain

      - name: Locate APK
        id: locate
        run: |
          APK_PATH=$(find app/build/outputs/apk/release -name "*.apk" | head -1)
          if [ -z "$APK_PATH" ]; then
            echo "Release APK not found, building debug instead"
            ./gradlew assembleDebug --no-daemon --console=plain
            APK_PATH=$(find app/build/outputs/apk/debug -name "*.apk" | head -1)
          fi
          echo "apk_path=$APK_PATH" >> "$GITHUB_OUTPUT"
          echo "APK at: $APK_PATH"

      - name: Determine tag
        id: tag
        run: |
          if [ -n "${{ github.event.inputs.tag }}" ]; then
            echo "tag=${{ github.event.inputs.tag }}" >> "$GITHUB_OUTPUT"
          elif [ "${GITHUB_REF_TYPE}" = "tag" ]; then
            echo "tag=${GITHUB_REF_NAME}" >> "$GITHUB_OUTPUT"
          else
            echo "tag=v0.0.0-${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"
          fi

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: NeoLightStudio-${{ steps.tag.outputs.tag }}-release
          path: ${{ steps.locate.outputs.apk_path }}
          retention-days: 90

      - name: Create GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          name: ${{ steps.tag.outputs.tag }}
          generate_release_notes: true
          files: ${{ steps.locate.outputs.apk_path }}
          body: |
            ## NeoLightStudio ${{ steps.tag.outputs.tag }}

            私人本地 BLE 应援棒控制 App。

            ### 下载
            - **app-release.apk**: 已签名的 release APK（如果可用），否则为 debug APK

            ### 主要功能
            - 三页面底部导航（首页 / 创作 / 设置）
            - 散场彩虹（应援棒内部真实底圈闪动效果）
            - 全灯渐变彩虹（可调速度，60-600 秒）
            - 音乐律动（麦克风感应）
            - 6 种语言：英语、简体中文、繁体中文、西班牙语、日语、韩语
            - 浅色/深色/跟随系统主题切换

            ### 安装
            启用「未知来源应用」后直接安装 APK。
